<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Esperança</title>
</head>
<body>
    <header>
        <h1>Cadastro</h1>
        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastre-se para participar</h2>

            <form action="#" method="post">

                <fieldset>
                    <legend>Dados pessoais</legend>

                    <p>
                        <label for="nome">Nome completo:</label><br>
                        <input type="text" id="nome" name="nome"
                               required minlength="3" maxlength="100">
                    </p>

                    <p>
                        <label for="email">E-mail:</label><br>
                        <input type="email" id="email" name="email"
                               required maxlength="100">
                    </p>

                    <p>
                        <label for="nascimento">Data de nascimento:</label><br>
                        <input type="date" id="nascimento" name="nascimento"
                               required>
                    </p>

                    <p>
                        <label for="cpf">CPF:</label><br>
                        <input type="text" id="cpf" name="cpf"
                               required maxlength="14"
                               pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                               placeholder="000.000.000-00"
                               inputmode="numeric">
                    </p>

                    <p>
                        <label for="telefone">Telefone:</label><br>
                        <input type="tel" id="telefone" name="telefone"
                               required maxlength="15"
                               pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}"
                               placeholder="(12) 99999-9999">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>

                    <p>
                        <label for="cep">CEP:</label><br>
                        <input type="text" id="cep" name="cep"
                               required maxlength="9"
                               pattern="[0-9]{5}-[0-9]{3}"
                               placeholder="00000-000"
                               inputmode="numeric">
                    </p>

                    <p>
                        <label for="endereco">Endereço:</label><br>
                        <input type="text" id="endereco" name="endereco"
                               required maxlength="150">
                    </p>

                    <p>
                        <label for="cidade">Cidade:</label><br>
                        <input type="text" id="cidade" name="cidade"
                               required maxlength="80">
                    </p>

                    <p>
                        <label for="estado">Estado:</label><br>
                        <input type="text" id="estado" name="estado"
                               required maxlength="50">
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Interesse</legend>

                    <p>
                        <input type="radio" id="voluntario"
                               name="interesse"
                               value="voluntariado" required>
                        <label for="voluntario">Voluntariado</label>
                    </p>

                    <p>
                        <input type="radio" id="doador"
                               name="interesse" value="doacao">
                        <label for="doador">Doação</label>
                    </p>

                    <p>
                        <input type="radio" id="ambos"
                               name="interesse" value="ambos">
                        <label for="ambos">Voluntariado e doação</label>
                    </p>
                </fieldset>

                <p>
                    <input type="checkbox" id="termos"
                           name="termos" required>
                    <label for="termos">
                        Concordo com o uso dos dados para contato.
                    </label>
                </p>

                <p>
                    <button type="submit">Enviar cadastro</button>
                    <button type="reset">Limpar formulário</button>
                </p>

            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ONG Esperança. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
